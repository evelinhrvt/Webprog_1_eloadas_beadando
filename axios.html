<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Axios CRUD</title>
    <link rel="stylesheet" href="style.css">
    <script src="menu.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>

<main id="root"></main>

<script type="text/babel">
    const { useState, useEffect } = React;
    const API_URL = 'api.php';

    function App() {
        const [mozik, setMozik] = useState([]);
        const [nev, setNev] = useState("");
        const [cim, setCim] = useState("");
        const [hiba, setHiba] = useState("");

        const betolt = () => {
            axios.get(API_URL)
                .then(res => { if (Array.isArray(res.data)) { setMozik(res.data); } else { setMozik([]); } })
                .catch(err => setHiba("Nem sikerült kapcsolódni az adatbázishoz. Ellenőrizd a kapcsolat.php-t!"));
        };

        useEffect(() => { betolt(); }, []);

        const hozzaad = () => {
            if(nev && cim) {
                axios.post(API_URL, { mozinev: nev, cim: cim }).then(() => { betolt(); setNev(""); setCim(""); });
            }
        };

        const torol = (id) => {
            axios.delete(API_URL, { data: { moziazon: id } }).then(() => betolt());
        };

        return (
            <div className="container">
                <h2>Mozik Kezelése (Szerver oldali - Axios)</h2>
                <br/>
                <div>
                    <input type="text" placeholder="Mozi neve" value={nev} onChange={(e) => setNev(e.target.value)} />
                    <input type="text" placeholder="Címe" value={cim} onChange={(e) => setCim(e.target.value)} />
                    <button onClick={hozzaad}>Hozzáadás</button>
                </div>
                {hiba && <p style={{color: '#e50914', marginTop: '20px', fontWeight: 'bold'}}>{hiba}</p>}
                {mozik.length === 0 && !hiba ? (
                    <p style={{marginTop: '40px', color: '#aaa', fontStyle: 'italic'}}>Az adatbázis jelenleg üres. Kérlek, adj hozzá egy mozit fent!</p>
                ) : (
                    <ul>
                        {mozik.map(mozi => (
                            <li key={mozi.moziazon}>
                                <div style={{flex: 1}}><strong>{mozi.mozinev}</strong> <span style={{color: '#aaa'}}>({mozi.cim})</span></div>
                                <button onClick={() => torol(mozi.moziazon)} style={{marginLeft: '10px', backgroundColor: '#e50914'}}>Törlés</button>
                            </li>
                        ))}
                    </ul>
                )}
            </div>
        );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
